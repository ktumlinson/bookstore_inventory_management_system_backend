services:
  db:
    image: postgres:18
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123Admin!@#
      POSTGRES_DB: bims
    ports:
      - "5332:5432"
    volumes:
      - pgdata:/var/lib/postgres/data

volumes:
  pgdata:
    driver: local