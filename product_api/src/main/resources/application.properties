spring.application.name=bims
spring.main.banner-mode=off

spring.datasource.url=jdbc:postgresql://localhost:5332/bims
spring.datasource.username=admin
spring.datasource.password=123Admin!@#
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor
spring.jpa.properties.hibernate.javax.persistence.schema-generation.create-database-schemas=true
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=true
